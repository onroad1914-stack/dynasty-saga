<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群雄の年代記</title><style>*{box-sizing:border-box}body{background:#121e2b;color:#f4ead5;font-family:system-ui;margin:0}.wrap{max-width:550px;margin:auto;padding:22px 16px}header{text-align:center;padding:25px 0}small,h2{color:#d8b876}h1{font: bold 34px serif;letter-spacing:.15em}.panel{border:1px solid #4d5d6b;background:#1d2e40;padding:16px;border-radius:12px;margin:14px 0}h2{font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{background:#315a58;border:1px solid #8aada4;color:white;padding:13px 5px;border-radius:8px;font-size:14px}p{line-height:1.6}.person{background:#102234;padding:10px;margin:7px 0;border-radius:8px}.muted{color:#b0c0cf;font-size:13px}#notice{color:#f0d295}select{background:#102234;color:#fff;padding:12px;width:100%;margin:6px 0 13px;font-size:16px}.log{max-height:200px;overflow:auto;font-size:13px}</style></head><body><main class="wrap"><header><small>DYNASTY SAGA</small><h1>群雄の年代記</h1><p>英雄は去り、血脈は続く。</p></header><section class="panel"><p id="stats"></p><p id="notice"></p></section><section class="panel"><h2>一族</h2><div id="family"></div></section><section class="panel"><h2>仲間</h2><div id="party"></div></section><section class="panel"><h2>行動</h2><div class="grid"><button onclick="act('fight')">冒険に出る</button><button onclick="act('recruit')">仲間を募る 30G</button><button onclick="act('train')">鍛錬 20G</button><button onclick="act('rest')">休息 10G</button><button onclick="act('marry')">結婚 80G</button><button onclick="act('child')">子を授かる 60G</button><button onclick="act('year')">1年進める</button><button onclick="act('reset')">最初から</button></div></section><section class="panel"><h2>クラスチェンジ</h2><p class="muted">Lv.3以上 / 50G</p><select id="choose"></select><div class="grid"><button onclick="change('騎士')">騎士</button><button onclick="change('術士')">術士</button></div></section><section class="panel"><h2>年代記</h2><div class="log" id="logs"></div></section><p class="muted">試作版 v0.1 | 端末に進行を自動保存</p></main><script>
const $=x=>document.getElementById(x),names=['リュカ','ミラ','レオン','セナ','ユウ','ナギ','シオン','エルナ'],name=()=>names[Math.floor(Math.random()*names.length)],hero=(n,a=18)=>({id:Math.random().toString(36).slice(2),n,a,lv:1,xp:0,hp:30,mhp:30,atk:7,job:'旅人'}),fresh=()=>({year:1,gold:120,fame:0,ruler:hero('アルト',20),spouse:null,kids:[],party:[hero('リュカ'),hero('ミラ')],logs:['建国元年。年代記が始まった。']});let s;try{s=JSON.parse(localStorage.getItem('dynastySagaV1'))||fresh();if(!s.ruler||!s.party)throw 0}catch(e){s=fresh()}
function log(t){s.logs.unshift('【'+s.year+'年】'+t);s.logs=s.logs.slice(0,50);$('notice').textContent=t}function person(h){return '<div class="person"><b>'+h.n+'</b> · '+h.job+'<p class="muted">Lv.'+h.lv+'　'+h.a+'歳　HP '+h.hp+'/'+h.mhp+'　攻撃 '+h.atk+'</p></div>'}function render(){$('stats').textContent='紀元 '+s.year+'年　|　金貨 '+s.gold+'G　|　名声 '+s.fame;$('family').innerHTML='<p class="muted">当主</p>'+person(s.ruler)+(s.spouse?'<p class="muted">伴侶</p>'+person(s.spouse):'<p>未婚</p>')+'<p>子ども '+s.kids.length+'人</p>'+s.kids.map(person).join('');$('party').innerHTML=s.party.map(person).join('');$('choose').innerHTML=[s.ruler,...s.party].map(h=>'<option value="'+h.id+'">'+h.n+' Lv.'+h.lv+'</option>').join('');$('logs').innerHTML=s.logs.map(x=>'<p>'+x+'</p>').join('');try{localStorage.setItem('dynastySagaV1',JSON.stringify(s))}catch(e){}}function spend(n){if(s.gold<n){log('金貨が足りない');return false}s.gold-=n;return true}function xp(h){h.xp++;if(h.xp>=h.lv*2){h.xp=0;h.lv++;h.mhp+=5;h.hp=h.mhp;h.atk+=2;log(h.n+'がレベルアップした')}}function act(a){switch(a){case 'fight':{let group=[s.ruler,...s.party].filter(x=>x.hp>0),power=group.reduce((v,h)=>v+h.atk,0);if(!group.length){log('休息が必要だ');break}if(power>=12+s.year*2+Math.random()*16){let g=12+Math.floor(Math.random()*20);s.gold+=g;s.fame+=5;group.forEach(xp);log('冒険に勝利、'+g+'Gを獲得')}else{group.forEach(h=>h.hp=Math.max(0,h.hp-8));log('敗北、仲間が負傷した')}break}case 'recruit':if(s.party.length>=6){log('仲間は6人まで');break}if(spend(30)){let h=hero(name());s.party.push(h);log(h.n+'が仲間になった')}break;case 'train':if(spend(20)){[s.ruler,...s.party].forEach(xp);log('全員が鍛錬した')}break;case 'rest':if(spend(10)){[s.ruler,...s.party].forEach(h=>h.hp=h.mhp);log('体力を回復した')}break;case 'marry':if(s.spouse){log('すでに結婚している');break}if(spend(80)){s.spouse=hero(name(),s.ruler.a);log(s.spouse.n+'と結婚した')}break;case 'child':if(!s.spouse){log('結婚が必要だ');break}if(s.kids.length>=5){log('子どもは5人まで');break}if(spend(60)){let h=hero(name(),0);s.kids.push(h);log(h.n+'が誕生した')}break;case 'year':s.year++;s.gold+=8+Math.floor(s.fame/20);[s.ruler,...s.party,...s.kids,...(s.spouse?[s.spouse]:[])].forEach(h=>h.a++);log('年が進み税収を得た');if(s.ruler.a>=55){let heir=s.kids.filter(h=>h.a>=16).sort((a,b)=>b.a-a.a)[0];if(heir){s.kids=s.kids.filter(h=>h!==heir);s.ruler=heir;s.spouse=null;s.fame+=15;log(heir.n+'が家督を継いだ')}else{s.ruler=hero(name(),20);s.spouse=null;s.fame=Math.max(0,s.fame-20);log('遠縁の者が家督を継いだ')}}break;case 'reset':if(confirm('最初から始めますか？')){s=fresh();log('新しい物語が始まる')}break}render()}function change(job){let h=[s.ruler,...s.party].find(h=>h.id===$('choose').value);if(!h||h.lv<3){log('Lv.3以上が必要');render();return}if(h.job===job){log('既にその職業');render();return}if(spend(50)){h.job=job;h.atk+=job==='騎士'?5:7;h.mhp+=job==='騎士'?12:4;h.hp=h.mhp;log(h.n+'が'+job+'になった')}render()}$('notice').textContent='行動を選んで年代記を進めよう';render();
</script></body></html>
