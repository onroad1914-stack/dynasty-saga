<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101c2c"><title>群雄の年代記 v0.2</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#273e55,#101c2c 65%);color:#f4ead7;font-family:system-ui,sans-serif}.wrap{max-width:560px;margin:auto;padding:16px 14px 60px}header{text-align:center;padding:23px 0}header small,h2{color:#dfbd7c}h1{font:700 34px serif;letter-spacing:.12em;margin:8px}header p{font:16px serif}.panel{background:#1d3041;border:1px solid #536476;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 12px 26px #0002}h2{font-size:18px;margin:0 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat{padding:12px 5px;background:#112435;border-radius:9px}.stat b{display:block;color:#efc982;font-size:20px}.stat span,.hint{color:#a8bcc9;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{background:#35655d;border:1px solid #78a79c;color:#fff;padding:12px 6px;border-radius:8px;font-size:14px;min-height:46px;font-weight:600;touch-action:manipulation}button.alt{background:#334f68;border-color:#7894ae}button.gold{background:#82633b;border-color:#d2aa70}.tabs{display:flex;gap:7px;margin:16px 0}.tabs button{flex:1;font-size:12px;min-height:40px;padding:6px}.tabs .active{background:#987548}.hidden{display:none}.person{border:1px solid #36536b;background:#122637;padding:12px;border-radius:9px;margin:8px 0}.person small{color:#b3c4d2;display:block;margin-top:6px}.bar{height:6px;border-radius:6px;background:#4a4144;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;background:#72bb92}.enemy{background:#342d39;text-align:center;border:1px solid #866c68;padding:16px;border-radius:10px}.enemy .emoji{font-size:52px}.enemy b{display:block;margin:8px}select{width:100%;padding:13px;border-radius:8px;background:#102536;color:white;border:1px solid #60798f;font-size:16px;margin-bottom:12px}.log{max-height:300px;overflow:auto}.log p{border-bottom:1px solid #425469;padding-bottom:9px;font-size:13px;line-height:1.7}.notice{color:#f2cb89;min-height:26px}.full{width:100%;margin-top:9px}.hint{line-height:1.7}footer{text-align:center;color:#96aab9;font-size:11px;margin:25px}</style></head><body><main class="wrap"><header><small>DYNASTY SAGA</small><h1>群雄の年代記</h1><p>英雄は去り、血脈は続く。</p></header><div class="stats"><div class="stat"><b id="year"></b><span>年代</span></div><div class="stat"><b id="gold"></b><span>金貨</span></div><div class="stat"><b id="fame"></b><span>名声</span></div></div><section class="panel"><div class="notice" id="notice"></div></section><nav class="tabs"><button class="active" data-tab="adventure">冒険</button><button data-tab="party">仲間</button><button data-tab="family">一族</button><button data-tab="history">年代記</button></nav><div id="adventure"><section class="panel"><h2>⚔️ 冒険</h2><div id="battle"></div><div class="grid" id="field"><button onclick="startBattle()">探索に出る</button><button class="alt" onclick="train()">鍛錬 20G</button><button class="alt" onclick="rest()">休息 10G</button><button class="gold" onclick="yearNext()">1年進める</button></div></section><section class="panel"><h2>旅団</h2><div id="preview"></div></section></div><div id="party" class="hidden"><section class="panel"><h2>仲間</h2><button class="full" onclick="recruit()">仲間を募る 30G</button><div id="members"></div></section><section class="panel"><h2>クラスチェンジ</h2><p class="hint">Lv.3以上／50G</p><select id="choose"></select><div class="grid"><button onclick="jobChange('騎士')">🛡️ 騎士</button><button onclick="jobChange('術士')">✨ 術士</button><button onclick="jobChange('剣士')">⚔️ 剣士</button><button onclick="jobChange('癒し手')">🌿 癒し手</button></div></section></div><div id="family" class="hidden"><section class="panel"><h2>王家の系譜</h2><div id="relatives"></div><div class="grid"><button onclick="marry()">結婚 80G</button><button onclick="child()">子を授かる 60G</button><button class="gold" onclick="yearNext()">1年進める</button><button class="alt" onclick="chooseHeir()">後継者指名</button></div><p class="hint">55歳で家督継承。16歳以上の子を後継者に指名できます。</p></section></div><div id="history" class="hidden"><section class="panel"><h2>年代記</h2><div id="logs" class="log"></div></section><section class="panel"><button class="alt full" onclick="reset()">最初から始める</button><p class="hint">進行は端末内に自動保存。Safariのサイトデータ削除で消える場合があります。</p></section></div><footer>試作版 v0.2 · 自動保存対応</footer></main><script>
'use strict';const $=id=>document.getElementById(id),key='dynastySagaV1',names=['リュカ','ミラ','レオン','セナ','ユウ','ナギ','シオン','エルナ','アッシュ','カイ','アイラ'],rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rand(0,a.length-1)],hero=(n,a=18)=>({id:Math.random().toString(36).slice(2)+Date.now(),n,a,lv:1,xp:0,hp:30,mhp:30,atk:7,job:'旅人'}),fresh=()=>({year:1,gold:120,fame:0,ruler:hero('アルト',20),spouse:null,kids:[],party:[hero('リュカ'),hero('ミラ')],logs:['【1年】年代記が始まった。'],battle:null,heirId:null});let s;try{s=JSON.parse(localStorage.getItem(key))||fresh();if(!s.ruler||!Array.isArray(s.party))throw 0}catch(e){s=fresh()}s.kids=s.kids||[];s.logs=s.logs||[];s.battle=s.battle||null;let tab='adventure',notice='新たな冒険を始めよう。';const all=()=>[s.ruler,...s.party],alive=()=>all().filter(h=>h.hp>0),esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));for(const h of [...all(),...s.kids,...(s.spouse?[s.spouse]:[])]){h.id=h.id||Math.random().toString(36).slice(2);h.job=h.job||'旅人';h.xp=h.xp||0;h.hp=Math.max(0,Math.min(h.hp??30,h.mhp||30))}function log(t){notice=t;s.logs.unshift('【'+s.year+'年】'+t);s.logs=s.logs.slice(0,80)}function pay(g){if(s.gold<g){notice='金貨が足りません。';return false}s.gold-=g;return true}function xp(h,n=1){h.xp+=n;while(h.xp>=h.lv*2){h.xp-=h.lv*2;h.lv++;h.atk+=2;h.mhp+=5;h.hp=Math.min(h.mhp,h.hp+5)}}function card(h,role){return '<div class="person"><b>'+esc(h.n)+'</b> · '+esc(role||h.job)+'<small>'+esc(h.job)+' ｜ Lv.'+h.lv+' ｜ '+h.a+'歳 ｜ HP '+h.hp+'/'+h.mhp+' ｜ 攻撃 '+h.atk+'</small><div class="bar"><i style="width:'+Math.round(h.hp/h.mhp*100)+'%"></i></div></div>'}function render(){ $('year').textContent=s.year+'年';$('gold').textContent=s.gold+'G';$('fame').textContent=s.fame;$('notice').textContent=notice;$('preview').innerHTML=all().map((h,i)=>card(h,i===0?'当主':null)).join('');$('members').innerHTML=s.party.map(h=>card(h)).join('');$('relatives').innerHTML=card(s.ruler,'当主')+(s.spouse?card(s.spouse,'伴侶'):'<p>未婚</p>')+(s.kids.length?s.kids.map(h=>card(h,s.heirId===h.id?'後継者':'子')).join(''):'<p>子どもはいません</p>');let current=$('choose').value;$('choose').innerHTML=all().map(h=>'<option value="'+h.id+'">'+esc(h.n)+' Lv.'+h.lv+'</option>').join('');if(all().some(h=>h.id===current))$('choose').value=current;$('logs').innerHTML=s.logs.map(t=>'<p>'+esc(t)+'</p>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['adventure','party','family','history'].forEach(id=>$(id).classList.toggle('hidden',id!==tab));$('field').classList.toggle('hidden',!!s.battle);battleUI();try{localStorage.setItem(key,JSON.stringify(s))}catch(e){$('notice').textContent='保存できません。Safariのストレージ設定を確認してください。'}}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));function busy(){if(s.battle){notice='戦闘を終了してください';render();return true}return false}function recruit(){if(busy())return;if(s.party.length>=6){notice='仲間は6人まで';return render()}if(pay(30)){let h=hero(pick(names));h.atk+=rand(0,3);s.party.push(h);log(h.n+'が仲間になった')}render()}function train(){if(busy())return;if(pay(20)){all().forEach(h=>xp(h));log('旅団が鍛錬を積んだ')}render()}function rest(){if(busy())return;if(pay(10)){all().forEach(h=>h.hp=h.mhp);log('旅団は体力を回復した')}render()}function jobChange(job){if(busy())return;let h=all().find(h=>h.id===$('choose').value);if(!h||h.lv<3){notice='Lv.3以上が必要';return render()}if(h.job===job){notice='すでに同じ職業です';return render()}if(pay(50)){h.job=job;h.atk+=({騎士:4,術士:6,剣士:7,癒し手:2})[job];h.mhp+=({騎士:14,術士:5,剣士:7,癒し手:10})[job];h.hp=h.mhp;log(h.n+'は'+job+'に転職した')}render()}function marry(){if(busy())return;if(s.spouse){notice='すでに結婚しています';return render()}if(pay(80)){s.spouse=hero(pick(names),Math.max(18,s.ruler.a+rand(-3,3)));log(s.spouse.n+'と結婚した')}render()}function child(){if(busy())return;if(!s.spouse){notice='結婚が必要';return render()}if(s.kids.length>=5){notice='子どもは5人まで';return render()}if(pay(60)){let h=hero(pick(names),0);h.atk=Math.max(7,Math.floor((s.ruler.atk+s.spouse.atk)/3));s.kids.push(h);log(h.n+'が誕生した')}render()}function chooseHeir(){if(busy())return;let c=s.kids.filter(h=>h.a>=16);if(!c.length){notice='16歳以上の子どもがいません';return render()}let answer=prompt('後継者の番号を入力\n'+c.map((h,i)=>(i+1)+'. '+h.n+' '+h.a+'歳').join('\n'),'1');if(answer===null)return;let h=c[Number(answer)-1];if(!h){notice='番号が正しくありません';return render()}s.heirId=h.id;log(h.n+'を後継者に指名した');render()}function yearNext(){if(busy())return;s.year++;s.gold+=8+Math.floor(s.fame/20);[...all(),...s.kids,...(s.spouse?[s.spouse]:[])].forEach(h=>h.a++);log('一年が経過し、税収を得た');if(s.ruler.a>=55){let heir=s.kids.find(h=>h.id===s.heirId&&h.a>=16)||s.kids.filter(h=>h.a>=16).sort((a,b)=>b.a-a.a)[0];if(heir){s.kids=s.kids.filter(h=>h.id!==heir.id);s.ruler=heir;s.fame+=15;log(heir.n+'が家督を継いだ')}else{s.ruler=hero(pick(names),20);s.fame=Math.max(0,s.fame-20);log('遠縁の者が家督を継いだ')}s.spouse=null;s.heirId=null}render()}const enemies=[['野盗','🏴‍☠️'],['魔狼','🐺'],['古代の守護者','🗿'],['黒騎士','⚔️'],['深淵の竜','🐉']];function startBattle(){if(s.battle)return;if(!alive().length){notice='休息が必要です';return render()}let rank=Math.min(4,Math.floor(s.fame/40)),enemy=enemies[rank],hp=32+rank*25+Math.floor(s.year/5)*3;s.battle={name:enemy[0],emoji:enemy[1],hp,max:hp,atk:5+rank*4,guard:false,info:'敵が現れた！'};notice=enemy[0]+'との戦闘開始';render()}function battleAction(action){let b=s.battle;if(!b)return;let power=alive().reduce((v,h)=>v+h.atk,0),info='';if(action==='attack'){let d=Math.max(1,Math.floor(power*.5)+rand(-3,5));b.hp=Math.max(0,b.hp-d);info='攻撃 '+d+'ダメージ'}else if(action==='skill'){if(!pay(8))return render();let d=Math.max(1,Math.floor(power*.8)+rand(0,10));b.hp=Math.max(0,b.hp-d);info='連携奥義 '+d+'ダメージ'}else if(action==='heal'){if(!pay(12))return render();alive().forEach(h=>h.hp=Math.min(h.mhp,h.hp+Math.max(8,Math.floor(h.mhp*.3))));info='回復した'}else if(action==='guard'){b.guard=true;info='防御態勢をとった'}else if(action==='escape'){if(Math.random()<.75){s.battle=null;log('戦闘から撤退した');return render()}info='逃走失敗'}if(b.hp<=0){let g=20+Math.floor(b.max/2)+rand(0,12);s.gold+=g;s.fame+=8;alive().forEach(h=>xp(h,2));s.battle=null;log(b.name+'に勝利！ '+g+'Gと名声8を獲得');return render()}let targets=alive(),target=pick(targets),d=Math.max(1,b.atk+rand(0,5)-(b.guard?Math.floor(b.atk*.75):0));target.hp=Math.max(0,target.hp-d);b.guard=false;b.info=info+' ／ '+target.n+'は'+d+'ダメージを受けた';if(!alive().length){let lost=Math.min(15,s.gold);s.gold-=lost;s.battle=null;log('旅団は敗北し'+lost+'Gを失った');return render()}notice=b.info;render()}function battleUI(){let b=s.battle;if(!b){$('battle').innerHTML='<p class="hint">ターン制戦闘。攻撃・連携奥義・防御・回復を使い分け、敵を倒そう。</p>';return}$('battle').innerHTML='<div class="enemy"><div class="emoji">'+b.emoji+'</div><b>'+esc(b.name)+'</b><div>HP '+b.hp+' / '+b.max+'</div><div class="bar"><i style="width:'+Math.round(100*b.hp/b.max)+'%;background:#c87a79"></i></div></div><p class="hint">'+esc(b.info)+'</p><div class="grid"><button onclick="battleAction(\'attack\')">通常攻撃</button><button class="gold" onclick="battleAction(\'skill\')">連携奥義 8G</button><button class="alt" onclick="battleAction(\'guard\')">防御</button><button class="alt" onclick="battleAction(\'heal\')">回復 12G</button></div><button class="alt full" onclick="battleAction(\'escape\')">撤退する</button>'}function reset(){if(confirm('保存データを削除して最初から始めますか？')){s=fresh();notice='新しい物語が始まった';tab='adventure';render()}}render();</script></body></html>
